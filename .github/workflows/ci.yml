name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11', '17', '21' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # pom 中 gpg 签名绑定在 verify 阶段，CI 无密钥，故执行到 test 阶段
      - name: Build and test
        run: mvn -B -ntp test
